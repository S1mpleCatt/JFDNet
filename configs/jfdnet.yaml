seed: 42
device: auto
output_dir: outputs
data:
  root: data/private
  signal_file: signals.npy
  label_file: labels.npy
  standardize: true
model:
  name: jfdnet
  input_joints: 6
  axes_per_joint: 3
  sequence_length: 2560
  wavelet: db4
  base_channels: 48
  tdwc_blocks: 3
  bdmm_layers: 5
  aim_attention: aim
  pre_attention: temporal
  post_attention: sh_sdsa
  dropout: 0.1
  use_neck: true
training:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  learning_rate: 0.001
  epochs: 50
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  gradient_clip: 1.0
  evaluated_joints: 4
  threshold: 0.5
